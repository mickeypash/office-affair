# Publishes the game to GitHub Pages on every push to main.
# Only the files copied in the "Collect site files" step are published (index.html, css, js, img).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A new push cancels a queued deploy, not a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Collect site files
        run: |
          mkdir -p _site
          cp -r index.html css js img _site/
          touch _site/.nojekyll
          # Cache busting: Pages lets browsers keep files for 10 minutes, so give every CSS/JS URL this commit's id.
          sed -i -E "s#(src=\"js/[^\"?]+\.js|href=\"css/[^\"?]+\.css)\"#\1?v=${GITHUB_SHA::7}\"#g" _site/index.html
          grep -q "js/main.js?v=${GITHUB_SHA::7}" _site/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
